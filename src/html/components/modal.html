<dialog id="app-modal" class="app-modal">
  <div class="modal-header">
    <div class="modal-title-group">
      <div class="modal-icon" id="modal-icon" hidden>
        <span class="material-symbols-outlined"></span>
      </div>

      <div>
        <h2 id="modal-title">Título del modal</h2>
        <p id="modal-subtitle"></p>
      </div>
    </div>

    <button
      type="button"
      class="modal-close"
      data-action="cancel"
      aria-label="Cerrar"
    >
      ✕
    </button>
  </div>

  <div id="modal-content" class="modal-content"></div>

  <div class="modal-actions">
    <button
      type="button"
      class="btn-secondary"
      data-action="cancel"
    >
      Cancelar
    </button>

    <button
      type="button"
      class="btn-primary"
      data-action="confirm"
    >
      Guardar
    </button>
  </div>
</dialog>
